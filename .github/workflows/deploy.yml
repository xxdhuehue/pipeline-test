  
name: CI/CD to Aliyun

# 触发条件：推送到 main 分支时执行
on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

jobs:
  build:
    runs-on: ubuntu-latest   

    steps:
  
      - name: Checkout code
        uses: actions/checkout@v4

 
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x 

      - name: Install pnpm
        uses: pnpm/action-setup@v3  
        with:
         version: 8  
     
      - name: Install dependencies
        run: pnpm install

 
      - name: Build app
        run: pnpm run build  

  deploy:
    needs: build
    runs-on: ubuntu-latest   

    steps:  
      - name: Deploy to Aliyun server
        uses: appleboy/scp-action@v0.1.7  
        with:
          host: ${{ secrets.ALIYUN_HOST }}     
          username: ${{ secrets.ALIYUN_USERNAME }}  
          key: ${{ secrets.ALIYUN_SSH_KEY }}      
          source: "/dist/**"                   
          target: /www/wwwroot/next/   
          strip_components: 1   
          
