  
name: Angular CI/CD to Aliyun

# 触发条件：推送到 main 分支时执行
on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest  # 使用 GitHub 提供的 Ubuntu 虚拟机

    steps:
      # 步骤 1：拉取 GitHub 仓库代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 步骤 2：安装 Node.js（Angular 构建依赖）
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x 

      - name: Install pnpm
        uses: pnpm/action-setup@v3  
        with:
         version: 8  
     
      - name: Install dependencies
        run: pnpm install

 
      - name: Build Angular app
        run: pnpm run build  

      # 步骤 6：部署到阿里云服务器（通过 SSH 传输文件）
      - name: Deploy to Aliyun server
        uses: appleboy/scp-action@v0.1.7  # 使用 SCP 工具传输文件
        with:
          host: ${{ secrets.ALIYUN_HOST }}       # 服务器 IP
          username: ${{ secrets.ALIYUN_USERNAME }} # 登录用户名
          key: ${{ secrets.ALIYUN_SSH_KEY }}      # SSH 私钥
          source: "/dist/**"                       # 本地待传输的文件（Angular 构建产物）
          target: /www/wwwroot/next/             # 服务器临时目录（避免直接覆盖）
          strip_components: 1                     # 移除 dist/ 目录层级，只传输内部文件

 
      
            
